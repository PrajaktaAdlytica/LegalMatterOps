name: Build Hostinger static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger-static
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:sites
      - uses: actions/checkout@v4
        with:
          ref: hostinger
          path: hostinger-publish
      - name: Update compiled website branch
        run: |
          rsync -a --delete --exclude='.git' dist/client/ hostinger-publish/
          cd hostinger-publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build from ${GITHUB_SHA}"
            git push origin hostinger
          fi
